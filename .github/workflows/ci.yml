name: CI

on:
  push:
    branches: [master, main, develop, beta, stable]
    paths-ignore:
      - 'docs/**'
      - 'wiki/**'
  pull_request:
    branches: [master, main, develop, beta, stable]
    paths-ignore:
      - 'docs/**'
      - 'wiki/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      checks: write
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      RUN_SONAR: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install SonarScanner
        if: env.RUN_SONAR == 'true' && env.SONAR_TOKEN != ''
        shell: pwsh
        run: dotnet tool install --tool-path .sonar/scanner dotnet-sonarscanner

      - name: Install coverage tool
        if: env.RUN_SONAR == 'true' && env.SONAR_TOKEN != ''
        shell: pwsh
        run: dotnet tool install --tool-path .coverage/tools dotnet-coverage

      - name: Restore
        run: dotnet restore src/StreamExtended.sln

      - name: Build
        run: dotnet build src/StreamExtended.sln --configuration Release --no-restore

      - name: Begin SonarCloud analysis
        if: env.RUN_SONAR == 'true' && env.SONAR_TOKEN != ''
        shell: pwsh
        run: >
          .\.sonar\scanner\dotnet-sonarscanner begin
          /k:"justcoding121_stream-extended"
          /o:"justcoding121"
          /d:sonar.token="$env:SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.vscoveragexml.reportsPaths="coverage/coverage.xml"
          /d:sonar.exclusions="**/docs/**,**/.github/**,**/wiki/**"

      - name: Build for SonarCloud analysis
        if: env.RUN_SONAR == 'true' && env.SONAR_TOKEN != ''
        run: dotnet build src/StreamExtended.sln --configuration Release --no-restore --no-incremental --disable-build-servers

      - name: Unit tests
        shell: pwsh
        run: |
          $collect = $env:RUN_SONAR -eq 'true' -and $env:SONAR_TOKEN
          $results = if ($collect) { 'coverage/unit' } else { '' }
          .\.github\scripts\run-test-suite.ps1 `
            -Project tests/StreamExtended.Tests/StreamExtended.Tests.csproj `
            -ResultsDirectory $results

      - name: Integration tests
        shell: pwsh
        run: |
          $collect = $env:RUN_SONAR -eq 'true' -and $env:SONAR_TOKEN
          $results = if ($collect) { 'coverage/integration' } else { '' }
          .\.github\scripts\run-test-suite.ps1 `
            -Project tests/StreamExtended.Integration.Tests/StreamExtended.Integration.Tests.csproj `
            -Filter 'TestCategory=Integration' `
            -ResultsDirectory $results `
            -Retries 2 `
            -HangBlame

      - name: E2E tests
        shell: pwsh
        run: |
          $collect = $env:RUN_SONAR -eq 'true' -and $env:SONAR_TOKEN
          $results = if ($collect) { 'coverage/e2e' } else { '' }
          .\.github\scripts\run-test-suite.ps1 `
            -Project tests/StreamExtended.Integration.Tests/StreamExtended.Integration.Tests.csproj `
            -Filter 'TestCategory=E2E' `
            -ResultsDirectory $results `
            -Retries 2 `
            -HangBlame

      - name: Merge code coverage
        if: env.RUN_SONAR == 'true' && env.SONAR_TOKEN != ''
        shell: pwsh
        run: .\.coverage\tools\dotnet-coverage merge "coverage\**\*.coverage" --output coverage/coverage.xml --output-format xml

      - name: Complete SonarCloud analysis
        if: env.RUN_SONAR == 'true' && env.SONAR_TOKEN != ''
        shell: pwsh
        run: .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"

      - name: Pack
        run: dotnet pack src/StreamExtended/StreamExtended.csproj --configuration Release --no-build --no-restore --output artifacts

      - name: Resolve VersionPrefix from csproj
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path src/StreamExtended/StreamExtended.csproj -Pattern '<VersionPrefix>([^<]+)</VersionPrefix>'
          if (-not $m) { throw 'VersionPrefix not found in StreamExtended.csproj' }
          $prefix = $m.Matches[0].Groups[1].Value
          "prefix=$prefix" >> $env:GITHUB_OUTPUT
          "nupkg=StreamExtended.$prefix.nupkg" >> $env:GITHUB_OUTPUT
          Write-Host "VersionPrefix=$prefix"

      - name: Assert packed package matches VersionPrefix
        shell: pwsh
        run: |
          $expected = '${{ steps.ver.outputs.nupkg }}'
          $pkg = Get-ChildItem artifacts -Filter 'StreamExtended.*.nupkg' |
            Where-Object { $_.Name -notlike '*.symbols.*' } |
            Select-Object -First 1
          if (-not $pkg) { throw 'No nupkg found in artifacts/' }
          if ($pkg.Name -ne $expected) {
            throw "Expected $expected (from VersionPrefix), got $($pkg.Name)"
          }
          Write-Host "Packed $($pkg.Name)"

      - name: Upload nupkg
        uses: actions/upload-artifact@v4
        with:
          name: streamextended-nupkg
          path: artifacts/${{ steps.ver.outputs.nupkg }}

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/StreamExtended.sln

      - name: Build
        run: dotnet build src/StreamExtended.sln --configuration Release --no-restore

      - name: Unit tests
        shell: pwsh
        run: |
          ./.github/scripts/run-test-suite.ps1 `
            -Project tests/StreamExtended.Tests/StreamExtended.Tests.csproj

      - name: Integration tests
        shell: pwsh
        run: |
          ./.github/scripts/run-test-suite.ps1 `
            -Project tests/StreamExtended.Integration.Tests/StreamExtended.Integration.Tests.csproj `
            -Filter 'TestCategory=Integration' `
            -Retries 2 `
            -HangBlame

      - name: E2E tests
        shell: pwsh
        run: |
          ./.github/scripts/run-test-suite.ps1 `
            -Project tests/StreamExtended.Integration.Tests/StreamExtended.Integration.Tests.csproj `
            -Filter 'TestCategory=E2E' `
            -Retries 2 `
            -HangBlame

  docs:
    name: docs
    needs: [build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install DocFX
        shell: pwsh
        run: |
          # Prefer the .NET tool over Chocolatey (matches titanium-web-proxy).
          dotnet tool install --global docfx
          Add-Content -Path $env:GITHUB_PATH -Value "$HOME/.dotnet/tools"

      - name: Update Documentation
        run: docfx .github/docfx.json

      - name: Publish Documentation
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9
        with:
          default_author: github_actions
          message: Update documentation
          committer_name: GitHub Actions
          committer_email: actions@github.com
          # Only commit DocFX output -- never Sonar/coverage/tool install artifacts
          add: 'docs'
          # DocFX often races another develop push; rebase instead of failing the job.
          pull: '--rebase --autostash'

  publish:
    name: Publish NuGet package
    needs: [build, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/stable')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: nuget-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Pack Beta
        if: github.ref == 'refs/heads/beta'
        run: |
          dotnet pack src/StreamExtended/StreamExtended.csproj \
            --configuration Release \
            --version-suffix beta \
            --output artifacts

      - name: Pack Stable
        if: github.ref == 'refs/heads/stable'
        run: |
          dotnet pack src/StreamExtended/StreamExtended.csproj \
            --configuration Release \
            --output artifacts

      - name: Resolve package version
        id: package
        shell: pwsh
        run: |
          $package = Get-ChildItem artifacts -Filter 'StreamExtended.*.nupkg' |
            Where-Object { $_.Name -notlike '*.symbols.*' } |
            Select-Object -First 1
          if (-not $package) { throw 'No NuGet package was produced.' }
          if ($package.BaseName -notmatch '^StreamExtended\.(.+)$') {
            throw "Unexpected package name: $($package.Name)"
          }
          $version = $Matches[1]
          "name=$($package.Name)" >> $env:GITHUB_OUTPUT
          "path=$($package.FullName)" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($version -match '-beta$') { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          Write-Host "Package $($package.Name) version=$version"

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package
        run: |
          dotnet nuget push "${{ steps.package.outputs.path }}" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.package.outputs.tag }}"
          $version = "${{ steps.package.outputs.version }}"
          $package = "${{ steps.package.outputs.path }}"
          $prerelease = "${{ steps.package.outputs.prerelease }}" -eq "true"

          if (gh release view $tag 2>$null) {
            Write-Host "Release $tag already exists; uploading package asset if missing."
            gh release upload $tag $package --clobber
          } else {
            $args = @(
              "release", "create", $tag,
              $package,
              "--title", $version,
              "--generate-notes",
              "--target", $env:GITHUB_SHA
            )
            if ($prerelease) { $args += "--prerelease" }
            gh @args
          }
