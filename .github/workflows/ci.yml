name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/StreamExtended.sln

      - name: Build
        run: dotnet build src/StreamExtended.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/StreamExtended.sln --configuration Release --no-build --no-restore --nologo

      - name: Pack
        run: dotnet pack src/StreamExtended/StreamExtended.csproj --configuration Release --no-build --no-restore --output artifacts

      - name: Assert package version 2.0.0
        shell: pwsh
        run: |
          $pkg = Get-ChildItem artifacts -Filter 'StreamExtended.*.nupkg' |
            Where-Object { $_.Name -notlike '*.symbols.*' } |
            Select-Object -First 1
          if (-not $pkg) { throw 'No nupkg found in artifacts/' }
          if ($pkg.Name -ne 'StreamExtended.2.0.0.nupkg') {
            throw "Expected StreamExtended.2.0.0.nupkg, got $($pkg.Name)"
          }
          Write-Host "Packed $($pkg.Name)"

      - name: Upload nupkg
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: streamextended-nupkg
          path: artifacts/StreamExtended.2.0.0.nupkg
